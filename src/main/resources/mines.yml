# =====================================================
#  Шахти. Кожна шахта - куб, обмежений pos1/pos2 в одному світі.
#  composition: мапа "MATERIAL: відсоток" (сума = 100)
#  Заповнюється командами:
#    /minewand                -> отримати wand
#    /mineset create <назва>
#    /mineset pos1 / pos2     -> лівий/правий клік wand-ом
#    /mineset setblock <назва> <MATERIAL> <відсоток>
#    /mineset reset <назва>
#  Приклад нижче показує формат (можна видалити або редагувати).
# =====================================================

mines: {}

# Приклад структури однієї шахти (не активний, лише довідка):
# mines:
#   mine_a:
#     world: world
#     x1: 100
#     y1: 60
#     z1: 100
#     x2: 130
#     y2: 90
#     z2: 130
#     teleport:
#       x: 115.5
#       y: 91.0
#       z: 115.5
#       yaw: 0.0
#       pitch: 0.0
#     composition:
#       STONE: 60
#       COAL_ORE: 20
