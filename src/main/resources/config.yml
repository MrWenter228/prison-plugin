baltop:
  refresh-interval-seconds: 120  # як часто оновлювати кеш офлайн-балансів для /baltop

auction:
  max-listings-per-player: 10     # скільки лотів одночасно може виставити один гравець
  max-price: 1000000000           # верхня межа ціни лота (захист від помилок вводу)
  listing-duration-hours: 72      # через скільки годин непроданий лот автоматично знімається
  expiry-check-interval-seconds: 300  # як часто перевіряти протухлі лоти

boosters:
  # Купуються за рублі через /booster. Повторна покупка ДОДАЄ термін до вже
  # активного бустера, а сила одразу перемикається на щойно куплену.
  # Допустимі рівні сили - лише 2, 3, 5 (BoosterManager.MULTIPLIERS).
  coins:
    tiers:
      2:
        price-day: 300
        price-week: 1500
        price-month: 5000
      3:
        price-day: 600
        price-week: 3000
        price-month: 10000
      5:
        price-day: 1200
        price-week: 6000
        price-month: 20000
  blocks:
    tiers:
      2:
        price-day: 300
        price-week: 1500
        price-month: 5000
      3:
        price-day: 600
        price-week: 3000
        price-month: 10000
      5:
        price-day: 1200
        price-week: 6000
        price-month: 20000

perks:
  # Пасивні бонуси, що видаються автоматично на певних рівнях (реальні
  # Bukkit AttributeModifier - справді впливають на бій, не косметика).
  hearts:
    max-bars: 4    # максимум 4 полоски здоров'я (80 HP разом із базовою)
    levels: [4, 7, 10, 13, 16, 19, 22, 25, 28, 31, 34, 37, 40]
  damage:
    max-bonus: 6   # максимум +6 додаткового урону
    levels: [12, 16, 20, 24, 28, 32]

economy:
  starting-balance: 0.0
  starting-rubles: 0.0
  currency-symbol: "$"      # символ монет
  rubles-symbol: "₽"        # символ рублів
