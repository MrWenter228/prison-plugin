  reward-multiplier-per-level: 0.02   # +2% до автопродажу за кожен рівень (як бонус старого престижу)
  # Вимоги для переходу НА кожен рівень (ключ = цільовий рівень). Не формула -
  # готова таблиця, скопійована з реальних чисел VimeWorld.
