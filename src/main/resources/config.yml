# =====================================================
#  Prison - головний конфіг
# =====================================================

storage:
  # Наразі підтримується лише YAML-сховище (playerdata/*.yml)
  # У майбутньому можна розширити до MySQL через PlayerDataStorage interface
  type: YAML

language:
  default: ru          # ru | en - мова за замовчуванням для нових гравців
  available: [ru, en]

mines:
  auto-reset-threshold: 0.4   # якщо лишилось <40% "цінних" блоків - шахта регенерується
  check-interval-seconds: 15  # як часто перевіряти % виробленості шахти
  broadcast-reset: true
  border-block: "BEDROCK"
  regen-blocks-per-tick: 2000 # скільки блоків ставити за один тік під час реген-батчингу (анти-лаг)

sellwand:
  # Блоки, зруйновані інструментом з увімкненим автопродажем, одразу конвертуються в гроші
  enabled: true

upgrades:
  # Прокачка "тірами" як на VimeWorld: кожен крок - це конкретний матеріал
  # предмета + один чи декілька рівнів зачарування (напр. фінальний тір
  # лопати одразу дає Ефективність III + Удачу I). Перший рядок кожної
  # категорії - стартовий тір (cost = 0). Кінцевий предмет кожного апгрейду
  # завжди незламний (Unbreakable), незалежно від матеріалу.
  #
  # SHOVEL - окрема категорія від tool: качається не рудою, а земляною
  # сировиною (DIRT/SAND/GRAVEL), тематично пов'язаною з копанням.
  tool:
    tiers:
      - material: WOODEN
        enchants: [{enchant: DIG_SPEED, level: 0}]
      - material: WOODEN
        enchants: [{enchant: DIG_SPEED, level: 1}]
        cost-coins: 500
      - material: STONE
        enchants: [{enchant: DIG_SPEED, level: 1}]
        cost-coins: 1000
        cost-material: COBBLESTONE
        cost-amount: 32
      - material: IRON
        enchants: [{enchant: DIG_SPEED, level: 2}]
        cost-coins: 3000
        cost-material: IRON_INGOT
        cost-amount: 32
      - material: DIAMOND
        enchants: [{enchant: DIG_SPEED, level: 3}]
        cost-coins: 8000
        cost-material: DIAMOND
        cost-amount: 16
  shovel:
    tiers:
      - material: WOODEN
        enchants: [{enchant: DIG_SPEED, level: 0}]
      - material: WOODEN
        enchants: [{enchant: DIG_SPEED, level: 1}]
        cost-coins: 400
        cost-material: DIRT
        cost-amount: 32
      - material: WOODEN
        enchants: [{enchant: DIG_SPEED, level: 2}]
        cost-coins: 700
        cost-material: DIRT
        cost-amount: 48
      - material: WOODEN
        enchants: [{enchant: DIG_SPEED, level: 3}]
        cost-coins: 1000
        cost-material: SAND
        cost-amount: 32
      - material: STONE
        enchants: [{enchant: DIG_SPEED, level: 1}]
        cost-coins: 1500
        cost-material: SAND
        cost-amount: 48
      - material: STONE
        enchants: [{enchant: DIG_SPEED, level: 2}]
        cost-coins: 2000
        cost-material: GRAVEL
        cost-amount: 32
      - material: STONE
        enchants: [{enchant: DIG_SPEED, level: 3}]
        cost-coins: 2600
        cost-material: GRAVEL
        cost-amount: 48
      - material: STONE
        enchants: [{enchant: DIG_SPEED, level: 4}]
        cost-coins: 3200
        cost-material: DIRT
        cost-amount: 64
      - material: IRON
        enchants: [{enchant: DIG_SPEED, level: 1}]
        cost-coins: 4000
        cost-material: SAND
        cost-amount: 64
      - material: IRON
        enchants: [{enchant: DIG_SPEED, level: 2}]
        cost-coins: 5000
        cost-material: GRAVEL
        cost-amount: 64
      - material: IRON
        enchants: [{enchant: DIG_SPEED, level: 3}]
        cost-coins: 6500
        cost-material: DIRT
        cost-amount: 96
      - material: IRON
        enchants: [{enchant: DIG_SPEED, level: 3}, {enchant: LOOT_BONUS_BLOCKS, level: 1}]
        cost-coins: 9000
        cost-material: GRAVEL
        cost-amount: 96
  sword:
    tiers:
      - material: WOODEN
        enchants: [{enchant: DAMAGE_ALL, level: 0}]
      - material: WOODEN
        enchants: [{enchant: DAMAGE_ALL, level: 1}]
        cost-coins: 500
      - material: STONE
        enchants: [{enchant: DAMAGE_ALL, level: 1}]
        cost-coins: 1000
        cost-material: COBBLESTONE
        cost-amount: 16
      - material: IRON
        enchants: [{enchant: DAMAGE_ALL, level: 2}]
        cost-coins: 3000
        cost-material: IRON_INGOT
        cost-amount: 24
      - material: DIAMOND
        enchants: [{enchant: DAMAGE_ALL, level: 3}]
        cost-coins: 7000
        cost-material: DIAMOND
        cost-amount: 12
  armor:
    tiers:
      - material: LEATHER
        enchants: [{enchant: PROTECTION_ENVIRONMENTAL, level: 0}]
      - material: LEATHER
        enchants: [{enchant: PROTECTION_ENVIRONMENTAL, level: 1}]
        cost-coins: 400
      - material: IRON
        enchants: [{enchant: PROTECTION_ENVIRONMENTAL, level: 1}]
        cost-coins: 1500
        cost-material: IRON_INGOT
        cost-amount: 24
      - material: DIAMOND
        enchants: [{enchant: PROTECTION_ENVIRONMENTAL, level: 2}]
        cost-coins: 6000
        cost-material: DIAMOND
        cost-amount: 12
